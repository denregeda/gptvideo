# Полный набор маршрутов HTTPS. Этот файл подключается только сервером 443.

location /media/ {
    alias /data/media/;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "no-cache";
}

location /api/ws/ {
    rewrite ^/api/ws/(.*)$ /ws/$1? break;
    proxy_pass $ds_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    limit_rate 0;
}

location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $ds_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    client_max_body_size 2G;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location /ws/ {
    rewrite ^/ws/(.*)$ /ws/$1? break;
    proxy_pass $ds_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    limit_rate 0;
}

location /docs {
    proxy_pass $ds_api;
    proxy_set_header Host $host;
}

location /openapi.json {
    proxy_pass $ds_api;
}

location = /health {
    proxy_pass $ds_api;
}

location /token {
    proxy_pass $ds_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    root /usr/share/nginx/panel;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
