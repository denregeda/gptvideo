worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Скорость отдачи файлов мини ПК (ограничение чтобы не перегружать сеть).
    # 20m = 20 МБ/с на соединение — для ~10 экранов и файлов ~500 МБ.
    # Панель/API отдаются мгновенно (мелкие ответы лимита не достигают). 0 = без ограничения.
    limit_rate 20m;

    # WebSocket-апгрейд: заголовок Connection ставим только для реальных
    # WS-запросов. Безусловный Connection: upgrade ломает keep-alive обычных
    # HTTP-запросов к API.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Встроенный DNS Docker. Нужен, потому что адрес апстрима задан ПЕРЕМЕННОЙ
    # (см. $ds_api ниже): так nginx перепроверяет имя api каждые valid=10s.
    # Без этого имя резолвится один раз при старте, и после пересоздания
    # контейнера api (docker compose up -d --force-recreate api) прокси
    # продолжает бить по старому IP — вся панель отдаёт 502 «чёрная панель»,
    # хотя сам api здоров. Раньше это лечили рестартом nginx вручную или
    # через selfheal.sh; теперь не возникает.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Query string намеренно не пишется: токены и чувствительные фильтры не
    # должны сохраняться в access log даже при ошибке старого клиента.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # HTTP-политика генерируется tls/manage_tls.sh. В переходном режиме
    # старые агенты сохраняют доступ к /api, /media и /health, а браузер
    # переводится на HTTPS. В строгом режиме перенаправляется весь HTTP.
    server {
        listen 80;
        server_name _;
        set $ds_api http://api:8000;
        include /etc/nginx/tls/http-policy.conf;
    }

    server {
        listen 443 ssl;
        server_name _;
        set $ds_api http://api:8000;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:DS_TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        include /etc/nginx/includes/https-locations.conf;
    }
}
